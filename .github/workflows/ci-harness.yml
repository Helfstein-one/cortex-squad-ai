name: CI Test Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  empirical-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Static Analysis (Ruff)
        run: uv run ruff check .

      - name: Strict Type Checking (Mypy)
        run: uv run mypy --strict src

      - name: Test Suite (Unit + Integration + E2E Harness)
        run: uv run pytest -v
